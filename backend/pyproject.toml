[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ────────────────────────────────────────────────────────
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # ── Database ─────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",       # Alembic sync driver for migrations

    # ── Validation ───────────────────────────────────────────────────────────
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # ── Redis / Celery ───────────────────────────────────────────────────────
    "redis[hiredis]==5.2.1",
    "celery[redis]==5.4.0",
    "celery-sqlalchemy-scheduler==0.3.0",

    # ── HTTP client ──────────────────────────────────────────────────────────
    "httpx==0.28.1",
    "tenacity==9.0.0",

    # ── Rate limiting ────────────────────────────────────────────────────────
    "slowapi==0.1.9",

    # ── Logging / observability ───────────────────────────────────────────────
    "structlog==24.4.0",
    "sentry-sdk[fastapi]==2.19.2",

    # ── Auth ─────────────────────────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "jwcrypto==1.5.6",
]

[project.optional-dependencies]
dev = [
    # ── Testing ──────────────────────────────────────────────────────────────
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",                  # async test client
    "anyio[trio]==4.7.0",

    # ── Linting / type-checking ───────────────────────────────────────────────
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0.20241004",

    # ── Import linting (rule 14/16 enforcement) ───────────────────────────────
    "import-linter==2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*", "ingestion*", "agents*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "TID",      # flake8-tidy-imports
    "RUF",      # ruff-specific
]
ignore = [
    "S101",     # assert is fine in tests
    "B008",     # FastAPI Depends() in default args is the pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "workers", "ingestion", "agents"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["database/migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"
# Coverage threshold raised per-phase; starts at 0 for Phase 1

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app", "workers", "ingestion", "agents"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ── Import-linter (engineering rules 14 + 16) ─────────────────────────────────
[tool.importlinter]
root_packages = ["app", "workers", "ingestion", "agents"]

[[tool.importlinter.contracts]]
name = "risk module must not import agents (rule 14)"
type = "forbidden"
source_modules = ["app.modules.risk"]
forbidden_modules = ["agents"]

[[tool.importlinter.contracts]]
name = "ingestion pipeline dedupe must not import agents (rule 14)"
type = "forbidden"
source_modules = ["ingestion.pipeline"]
forbidden_modules = ["agents"]

[[tool.importlinter.contracts]]
name = "price intelligence verify must not import agents (rule 14)"
type = "forbidden"
source_modules = ["app.modules.price_intelligence.verify"]
forbidden_modules = ["agents"]

[[tool.importlinter.contracts]]
name = "no module imports litellm directly (rule 16)"
type = "forbidden"
source_modules = ["app", "workers", "ingestion"]
forbidden_modules = ["litellm"]
